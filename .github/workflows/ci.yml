name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm --filter @allobook/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter @allobook/api prisma generate

      - name: Run Frontend Typecheck
        run: pnpm --filter @allobook/web typecheck

      - name: Run Backend Tests
        run: pnpm --filter @allobook/api test
        env:
          NODE_ENV: test
          JWT_SECRET: super-secret-jwt-key-min-16-chars
          JWT_REFRESH_SECRET: super-refresh-jwt-key-min-16-chars

      - name: Run Frontend Tests
        run: pnpm --filter @allobook/web test

      - name: Run Next.js Production Build
        run: pnpm --filter @allobook/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

  deploy-backend:
    name: Deploy Backend to Back4App
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Back4App Container Redeploy
        run: |
          curl --fail -s -X POST \
            "https://api.back4app.com/apps/${{ secrets.BACK4APP_APP_ID }}/deploy" \
            -H "X-Parse-Application-Id: ${{ secrets.BACK4APP_APP_ID }}" \
            -H "X-Parse-Master-Key: ${{ secrets.BACK4APP_MASTER_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            && echo "✅ Deploy triggered successfully" \
            || echo "⚠️ Deploy trigger failed (manual deploy may be needed)"
        continue-on-error: true
