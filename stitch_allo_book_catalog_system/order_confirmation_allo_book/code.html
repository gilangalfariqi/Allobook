                Your Order<br/>is Ready
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">
                Order #AB-20260816-001
            </p>
</header>
<!-- Summary Card (Level 1 Surface with Ghost Border) -->
<section class="mt-stack-lg bg-surface-container-lowest border border-surface-variant rounded-xl p-stack-md flex flex-col gap-stack-sm">
<div class="flex justify-between items-center border-b border-surface-variant pb-stack-sm">

</div>

            </p>
</div>
