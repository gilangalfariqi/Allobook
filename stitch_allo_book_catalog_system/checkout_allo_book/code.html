<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Ghost Border for Surface Cards */
        .ghost-border {
            border: 1px solid #E5E5E1;
        }
        
        /* Input Focus Ring */
        .input-ring:focus {
            outline: none;
            border-color: #001915;
            box-shadow: 0 0 0 1px #001915;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md antialiased md:hidden pb-safe min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 w-full z-50 border-b border-outline-variant flex items-center justify-between px-margin-mobile h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 transition-opacity p-2 -ml-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">Checkout</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-margin-mobile py-stack-md flex flex-col gap-stack-lg">
<!-- Progress Indicator -->
<div class="flex items-center w-full gap-2 px-4">
<div class="flex-1 h-[2px] bg-primary rounded-full"></div>
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">circle</span>
<div class="flex-1 h-[2px] bg-primary rounded-full"></div>
<span class="material-symbols-outlined text-outline-variant text-[16px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<div class="flex-1 h-[2px] bg-surface-variant rounded-full"></div>
</div>
<form class="flex flex-col gap-stack-lg" id="checkout-form">
<!-- Step 1: Customer Info -->
<section class="flex flex-col gap-stack-sm" id="step-1">
<h2 class="font-headline-sm text-headline-sm text-primary mb-2">Customer Info</h2>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="name" placeholder="Jane Doe" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="whatsapp">WhatsApp Number</label>
<div class="flex relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant material-symbols-outlined text-[20px]" data-icon="call">call</span>
<input class="w-full pl-10 bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="whatsapp" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="email" placeholder="jane@example.com" type="email"/>
</div>
</section>
<!-- Step 2: Shipping Info -->
<section class="flex flex-col gap-stack-sm" id="step-2">
<h2 class="font-headline-sm text-headline-sm text-primary mb-2 mt-4 border-t border-outline-variant pt-stack-md">Shipping Info</h2>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="address">Street Address</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant resize-none" id="address" placeholder="123 Editorial Lane" rows="2"></textarea>
</div>
<div class="flex gap-4">
<div class="flex flex-col gap-1 flex-1">
<label class="font-label-md text-label-md text-on-surface" for="city">City</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="city" placeholder="New York" type="text"/>
</div>
<div class="flex flex-col gap-1 flex-1">
<label class="font-label-md text-label-md text-on-surface" for="province">State/Province</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="province" placeholder="NY" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="postcode">Postcode</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="postcode" placeholder="10001" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="notes">Delivery Notes (Optional)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-body-md text-body-md text-on-surface input-ring transition-all placeholder:text-on-surface-variant" id="notes" placeholder="Leave at front desk" type="text"/>
</div>
</section>
<!-- Order Summary -->
<section class="bg-surface-container-lowest p-stack-sm rounded ghost-border mt-stack-md flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-on-surface border-b border-outline-variant pb-2">Order Summary</h3>
<div class="flex flex-col gap-3">
<div class="flex items-start gap-3">
<div class="w-12 h-16 bg-surface-variant rounded flex-shrink-0 relative overflow-hidden" style="border: 1px solid rgba(0,0,0,0.05)">
<img class="w-full h-full object-cover" data-alt="A minimalist book cover design featuring clean typography and soft, abstract watercolor shapes in pale sage and cream, positioned vertically on a stark white background under studio lighting. The design is elegant, modern, and aligned with a high-end editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlEYtdQj5eXJtKUhW38UUasHAprN_apXVof_Hq1iBU0ue7o1Ppfs9PgHt1wL2ighlluobXNX0jZCd5eeSu4vY13L8HiWpQNTkVwe4bKjswOccCi1g7vZpzDsW5AIjaBxsZv6jbT_fIQBSoHpddcOZSct3bIZqa8Ajpjqgz1MvReNkW6jHaQUx4sveTsHL6RSmPQIxkg5lV7ipV6KFP1LExNGWil8iu5zU6uCd0GeMqraKy-_3247zQzA"/>
</div>
<div class="flex-1">
<h4 class="font-body-md text-body-md text-on-surface line-clamp-1">The Architecture of Stillness</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant">Qty: 1</p>
</div>
<p class="font-body-md text-body-md text-on-surface font-semibold">$34.00</p>
</div>
</div>
<div class="border-t border-outline-variant pt-3 flex flex-col gap-1">
<div class="flex justify-between text-on-surface-variant">
<span class="font-body-md text-body-md">Subtotal</span>
<span class="font-body-md text-body-md">$34.00</span>
</div>
<div class="flex justify-between text-on-surface-variant">
<span class="font-body-md text-body-md">Shipping</span>
<span class="font-body-md text-body-md">Calculated later</span>
</div>
<div class="flex justify-between text-on-surface font-semibold mt-2 pt-2 border-t border-outline-variant">
<span class="font-headline-sm text-[20px]">Total</span>
<span class="font-headline-sm text-[20px]">$34.00</span>
</div>
</div>
</section>
</form>
</main>
<!-- Sticky Bottom CTA -->
<div class="sticky bottom-0 bg-surface-container-lowest border-t border-outline-variant p-margin-mobile flex flex-col gap-3 shadow-[0_-4px_20px_rgba(15,46,42,0.05)] z-40">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded flex items-center justify-center gap-2 hover:bg-primary-container transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
            Continue to WhatsApp
        </button>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center opacity-80 leading-tight">
            Your order details will be sent to Allo Book via WhatsApp for confirmation.
        </p>
</div>
</body></html>
